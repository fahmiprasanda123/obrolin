# Serves the built Vue app. /api and /cable never reach this server: the
# Kubernetes ingress routes them to the api and cable services.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Probe target for Kubernetes.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Vite puts content-hashed files in /assets, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: unknown paths (e.g. /workspaces/1/channels/2) load
  # index.html and Vue Router takes over. index.html itself is never cached
  # so a new deploy is picked up immediately.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
