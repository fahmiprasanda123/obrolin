apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        # Blocks startup until the migrate Job has run, so new code never
        # serves traffic against an old schema.
        - name: wait-for-migrations
          image: obrolin-backend
          command:
            - sh
            - -c
            - until bin/rails db:abort_if_pending_migrations >/dev/null 2>&1; do echo "waiting for migrations..."; sleep 5; done
          envFrom:
            - configMapRef: { name: obrolin-config }
            - secretRef: { name: obrolin-secrets }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: 500m, memory: 384Mi }
      containers:
        - name: api
          image: obrolin-backend
          command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef: { name: obrolin-config }
            - secretRef: { name: obrolin-secrets }
          securityContext:
            allowPrivilegeEscalation: false
          # Rails boots slowly; the startup probe gives it time before the
          # liveness probe may restart the container.
          startupProbe:
            httpGet: { path: /up, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /up, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /up, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
