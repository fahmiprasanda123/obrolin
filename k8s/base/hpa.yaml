# Scales the API on CPU. Requires metrics-server (kind: `make k8s-metrics`,
# minikube: `minikube addons enable metrics-server`). Without it the HPA
# shows <unknown> targets and never scales.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 # percent of the container's CPU *request*
