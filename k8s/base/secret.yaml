# EXAMPLE VALUES ONLY - never put real secrets in git.
#
# Create real ones instead, for example:
#   kubectl -n obrolin create secret generic obrolin-secrets \
#     --from-literal=POSTGRES_USER=obrolin \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=SECRET_KEY_BASE="$(openssl rand -hex 64)" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 64)" \
#     --dry-run=client -o yaml | kubectl apply -f -
# In real clusters use a secret manager (External Secrets, Sealed Secrets,
# SOPS, Vault) so encrypted or referenced secrets can live in git safely.
apiVersion: v1
kind: Secret
metadata:
  name: obrolin-secrets
type: Opaque
stringData:
  POSTGRES_USER: obrolin
  POSTGRES_PASSWORD: example-postgres-password
  SECRET_KEY_BASE: example-secret-key-base-replace-me-with-openssl-rand-hex-64
  JWT_SECRET: example-jwt-secret-replace-me-with-openssl-rand-hex-64
