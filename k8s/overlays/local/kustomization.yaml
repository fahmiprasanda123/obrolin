# Local kind/minikube overlay: images built and loaded locally, served at
# http://obrolin.local.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: obrolin-backend
    newTag: local
  - name: obrolin-frontend
    newTag: local

configMapGenerator:
  - name: obrolin-config
    behavior: merge
    literals:
      - ALLOWED_ORIGINS=http://obrolin.local
      - FRONTEND_URL=http://obrolin.local
