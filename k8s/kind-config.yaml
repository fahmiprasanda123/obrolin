# kind cluster for Obrolin: `make k8s-cluster`
# Maps host ports 80/443 into the node so ingress-nginx is reachable at
# http://obrolin.local (after adding it to /etc/hosts).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: obrolin
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
