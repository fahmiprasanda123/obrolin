# ActionCable uses Redis pub/sub in every environment except test, so a
# broadcast from any process (api pod, sidekiq, cable pod) reaches clients
# connected to any cable pod.
development:
  adapter: redis
  url: <%= ENV.fetch("REDIS_CABLE_URL", "redis://localhost:6379/1") %>
  channel_prefix: obrolin_development

test:
  adapter: test

production:
  adapter: redis
  url: <%= ENV.fetch("REDIS_CABLE_URL", "redis://localhost:6379/1") %>
  channel_prefix: obrolin_production
